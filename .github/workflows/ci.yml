name: CI Multi-Langages

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Préparer la base de données
        run: bash db/setup.sh

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances
        working-directory: python-app
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Lancer les tests Python
        working-directory: python-app
        run: python -m pytest -v

  node:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Préparer la base de données
        run: bash db/setup.sh

      - name: Installer Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer et Lancer les tests JS
        working-directory: node-app
        run: |
          npm ci
          npm test

  java:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Préparer la base de données
        run: bash db/setup.sh

      - name: Installer Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build et Test Java (Maven)
        working-directory: java-app
        run: mvn -B package

  php:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Préparer la base de données
        run: bash db/setup.sh

      - name: Installer PHP 8.3 et extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_pgsql

      - name: Installer Composer et Lancer PHPUnit
        working-directory: php-app
        run: |
          composer install --no-interaction
          vendor/bin/phpunit tests
