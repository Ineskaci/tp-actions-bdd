name: CI Multi-Langages

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Database
        run: bash db/setup.sh

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and test
        working-directory: python-app
        run: |
          pip install -r requirements.txt
          pip install pytest
          python -m pytest -v

  node:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Database
        run: bash db/setup.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and Test Node
        working-directory: node-app
        run: |
          npm install
          npm test

  java:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Database
        run: bash db/setup.sh

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build and Test Java
        working-directory: java-app
        run: mvn -B test

  php:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Database
        run: bash db/setup.sh

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_pgsql

      - name: Install Composer and Test PHP
        working-directory: php-app
        run: |
          composer install --no-interaction
          vendor/bin/phpunit tests
