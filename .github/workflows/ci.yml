name: CI Multi-Langages

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash db/setup.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install & Test Python
        working-directory: python-app
        run: |
          pip install -r requirements.txt
          pytest -v

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash db/setup.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install & Test Node.js
        working-directory: node-app
        run: |
          npm ci
          npm test

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash db/setup.sh
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build & Test Java
        working-directory: java-app
        run: mvn -B package

  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash db/setup.sh
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_pgsql
      - name: Install & Test PHP
        working-directory: php-app
        run: |
          composer install --no-interaction
          vendor/bin/phpunit tests
